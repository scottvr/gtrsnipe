[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtrsnipe"
version = "0.4.0"
description = "A command-line tool to translate between MIDI and various text notation systems, including ASCII tablature."
authors = [
  { name="ScottVR", email="scottvr@gmail.com" },
]
readme = "README.md" 
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Core deps: must stay torch/tensorflow/numba-free so `pip install gtrsnipe`
# resolves and runs the MIDI/tab/abc/vex pipeline on any CPU-only box.
# Audio features live behind the [audio]/[separation] extras below.
dependencies = [
    "MIDIFile",
    "midiutil",
    "mido>=1.3",
    "numpy>=2.1",
]

[project.scripts]
gtrsnipe = "gtrsnipe.converter:main"
gtrsnipe-play = "gtrsnipe.player.app:main"
gtrsnipe-chords = "gtrsnipe.chords.cli:main"

[project.urls]
"Homepage" = "https://github.com/scottvr/gtrsnipe" 

[tool.setuptools.packages.find]
include = ["gtrsnipe"]
exclude = ["separated", "docs"]

[project.optional-dependencies]
# librosa pYIN bass path (audio -> MIDI -> tab). Best-effort on Python 3.14
# (numba/llvmlite have no cp314 wheel yet); use 3.10-3.13 for this extra.
audio = [
    "librosa>=0.10",
    "soundfile",
    "scipy",
    "noisereduce",
]
# Optional stem isolation; demucs pulls torch (3.10-3.13 only).
separation = [
    "demucs",
]
# Player audio: stream MIDI to a port (DAW/VST host or system synth). mido is
# already a core dep; python-rtmidi is the sending backend.
play = [
    "python-rtmidi",
]
# Self-contained SoundFont synthesis for the player (no external host needed).
synth = [
    "pyfluidsynth",
]
all = [
    "gtrsnipe[audio]",
    "gtrsnipe[separation]",
    "gtrsnipe[play]",
    "gtrsnipe[synth]",
]
# Dev/test tooling (torch-free, so the core merge-gate job stays CPU-only).
test = [
    "pytest>=8",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "audio: requires the [audio] extra (librosa/soundfile/scipy/noisereduce)",
    "separation: requires the [separation] extra (demucs/torch)",
]